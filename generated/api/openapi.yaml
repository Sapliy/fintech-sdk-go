openapi: 3.1.0
info:
  contact:
    email: support@sapliy.io
    name: Sapliy Support
    url: https://sapliy.io/support
  description: "Official API for the Sapliy Fintech Ecosystem. Build robust financial\
    \ applications with our type-safe, high-integrity platform."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Sapliy Fintech API
  version: 1.0.0
servers:
- description: Production API
  url: https://api.sapliy.io
- description: Local Development (Gateway)
  url: http://localhost:8080
paths:
  /v1/auth/register:
    post:
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/registerUser_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerUser_201_response"
          description: Created
      summary: Register a new user
      tags:
      - Auth
  /v1/auth/login:
    post:
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/registerUser_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/registerUser_201_response"
          description: OK
      summary: Login
      tags:
      - Auth
  /v1/payments:
    post:
      operationId: createPaymentIntent
      parameters:
      - $ref: "#/components/parameters/ZoneIdHeader"
      - $ref: "#/components/parameters/ZoneModeHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createPaymentIntent_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
      security:
      - ApiKeyAuth: []
      summary: Create a Payment Intent
      tags:
      - Payments
  /v1/payments/{id}:
    get:
      operationId: getPaymentIntent
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/ZoneIdHeader"
      - $ref: "#/components/parameters/ZoneModeHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Payment Intent details
      tags:
      - Payments
  /v1/payments/intents/{id}/confirm:
    post:
      operationId: confirmPaymentIntent
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/ZoneIdHeader"
      - $ref: "#/components/parameters/ZoneModeHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/confirmPaymentIntent_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentIntent"
          description: Confirmed
      security:
      - ApiKeyAuth: []
      summary: Confirm a Payment Intent
      tags:
      - Payments
  /v1/ledger/accounts:
    post:
      parameters:
      - $ref: "#/components/parameters/ZoneIdHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_ledger_accounts_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerAccount"
          description: Created
      security:
      - ApiKeyAuth: []
      summary: Create Ledger Account
      tags:
      - Ledger
  /v1/ledger/transactions:
    post:
      parameters:
      - $ref: "#/components/parameters/ZoneIdHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_v1_ledger_transactions_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_v1_ledger_transactions_post_201_response"
          description: Recorded
      security:
      - ApiKeyAuth: []
      summary: Record Transaction
      tags:
      - Ledger
  /v1/wallets/{user_id}:
    get:
      operationId: getWallet
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/ZoneIdHeader"
      - $ref: "#/components/parameters/ZoneModeHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Wallet Balance
      tags:
      - Wallets
  /v1/wallets/topup:
    post:
      operationId: topupWallet
      parameters:
      - $ref: "#/components/parameters/ZoneIdHeader"
      - $ref: "#/components/parameters/ZoneModeHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/topupWallet_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/topupWallet_200_response"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Top up a wallet
      tags:
      - Wallets
  /v1/wallets/transfer:
    post:
      operationId: transferWallet
      parameters:
      - $ref: "#/components/parameters/ZoneIdHeader"
      - $ref: "#/components/parameters/ZoneModeHeader"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transferWallet_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/topupWallet_200_response"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Transfer between wallets
      tags:
      - Wallets
  /v1/billing/subscriptions:
    post:
      operationId: createSubscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createSubscription_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscription"
          description: Created
      security:
      - ApiKeyAuth: []
      summary: Create Subscription
      tags:
      - Billing
  /v1/events/emit:
    post:
      operationId: emitEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/emitEvent_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/emitEvent_202_response"
          description: Accepted
      security:
      - ApiKeyAuth: []
      summary: Emit an Event
      tags:
      - Events
  /v1/ledger/accounts/{id}:
    get:
      operationId: getLedgerAccount
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/ZoneIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerAccount"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Ledger Account details
      tags:
      - Ledger
  /v1/ledger/transactions/{id}:
    get:
      operationId: getLedgerTransaction
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/ZoneIdHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerTransaction"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Ledger Transaction details
      tags:
      - Ledger
  /v1/billing/subscriptions/{id}:
    delete:
      operationId: cancelSubscription
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Canceled
      security:
      - ApiKeyAuth: []
      summary: Cancel Subscription
      tags:
      - Billing
    get:
      operationId: getSubscription
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscription"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Subscription details
      tags:
      - Billing
  /v1/flows:
    post:
      operationId: createFlow
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationFlow"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationFlow"
          description: Created
      security:
      - ApiKeyAuth: []
      summary: Create a Flow
      tags:
      - Flows
  /v1/flows/{flowId}:
    delete:
      operationId: deleteFlow
      parameters:
      - explode: false
        in: path
        name: flowId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Deleted
      security:
      - ApiKeyAuth: []
      summary: Delete a Flow
      tags:
      - Flows
    get:
      operationId: getFlow
      parameters:
      - explode: false
        in: path
        name: flowId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationFlow"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Flow details
      tags:
      - Flows
    parameters:
    - explode: false
      in: path
      name: flowId
      required: true
      schema:
        type: string
      style: simple
    put:
      operationId: updateFlow
      parameters:
      - explode: false
        in: path
        name: flowId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationFlow"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationFlow"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Update a Flow
      tags:
      - Flows
  /v1/zones/{zoneId}/flows:
    get:
      operationId: listFlows
      parameters:
      - explode: false
        in: path
        name: zoneId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listFlows_200_response"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: List Flows in a Zone
      tags:
      - Flows
  /v1/executions/{executionId}:
    get:
      operationId: getExecution
      parameters:
      - explode: false
        in: path
        name: executionId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationFlowExecution"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Execution details
      tags:
      - Executions
  /v1/executions/{executionId}/resume:
    post:
      operationId: resumeExecution
      parameters:
      - explode: false
        in: path
        name: executionId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/resumeExecution_200_response"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Resume a paused Execution
      tags:
      - Executions
  /v1/zones/{zoneId}/events/past:
    get:
      operationId: getPastEvents
      parameters:
      - explode: false
        in: path
        name: zoneId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - explode: true
        in: query
        name: offset
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getPastEvents_200_response"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Get Past Events (Webhook Replay)
      tags:
      - Events
  /v1/events/{eventId}/replay:
    post:
      operationId: replayEvent
      parameters:
      - explode: false
        in: path
        name: eventId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/replayEvent_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/replayEvent_200_response"
          description: OK
      security:
      - ApiKeyAuth: []
      summary: Replay an Event
      tags:
      - Events
  /v1/auth/validate:
    post:
      operationId: validateKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/validateKey_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validateKey_200_response"
          description: OK
      summary: Validate an API key
      tags:
      - Auth
  /v1/zones:
    get:
      operationId: listZones
      parameters:
      - explode: true
        in: query
        name: org_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/listZones_200_response_inner"
                type: array
          description: OK
      security:
      - ApiKeyAuth: []
      summary: List or Get Zones
      tags:
      - Zones
    post:
      operationId: createZone
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createZone_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listZones_200_response_inner"
          description: Created
      security:
      - ApiKeyAuth: []
      summary: Create a Zone
      tags:
      - Zones
components:
  parameters:
    ZoneIdHeader:
      description: The ID of the zone for this request.
      explode: false
      in: header
      name: X-Zone-ID
      required: true
      schema:
        type: string
      style: simple
    ZoneModeHeader:
      description: The mode of the zone (live or test).
      explode: false
      in: header
      name: X-Zone-Mode
      required: false
      schema:
        enum:
        - live
        - test
        type: string
      style: simple
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Invalid request parameters.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Authentication failed.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Resource not found.
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Internal server error.
  schemas:
    ErrorEnvelope:
      example:
        error:
          trace_id: trace_id
          code: RATE_LIMIT_EXCEEDED
          message: Rate limit exceeded. Retry after 60 seconds.
          request_id: request_id
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope_error"
    PaymentIntent:
      example:
        amount: 2000
        metadata:
          key: metadata
        description: description
        created_at: 2000-01-23T04:56:07.000+00:00
        currency: USD
        id: pi_12345
        client_secret: client_secret
        status: requires_payment_method
      properties:
        id:
          example: pi_12345
          type: string
        amount:
          example: 2000
          format: int64
          type: integer
        currency:
          example: USD
          type: string
        status:
          enum:
          - requires_payment_method
          - requires_confirmation
          - requires_action
          - processing
          - requires_capture
          - canceled
          - succeeded
          type: string
        client_secret:
          description: Used for client-side confirmation.
          type: string
        description:
          type: string
        metadata:
          additionalProperties:
            type: string
        created_at:
          format: date-time
          type: string
      required:
      - amount
      - currency
      - id
      - status
    Wallet:
      example:
        balance: 0
        user_id: user_id
        currency: currency
        id: id
      properties:
        id:
          type: string
        user_id:
          type: string
        balance:
          format: int64
          type: integer
        currency:
          type: string
      required:
      - balance
      - currency
      - id
      - user_id
    LedgerAccount:
      example:
        balance: 0
        name: name
        currency: currency
        id: id
        type: type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        currency:
          type: string
        balance:
          format: int64
          type: integer
      required:
      - currency
      - id
      - name
      - type
    LedgerTransaction:
      example:
        entries:
        - amount: 0
          account_id: account_id
        - amount: 0
          account_id: account_id
        reference_id: reference_id
        description: description
        id: id
        status: status
      properties:
        id:
          type: string
        reference_id:
          type: string
        description:
          type: string
        status:
          type: string
        entries:
          items:
            $ref: "#/components/schemas/LedgerEntry"
          type: array
      required:
      - id
      - reference_id
      - status
    LedgerEntry:
      example:
        amount: 0
        account_id: account_id
      properties:
        account_id:
          type: string
        amount:
          format: int64
          type: integer
      required:
      - account_id
      - amount
    User:
      example:
        email_verified: true
        id: id
        email: email
      properties:
        id:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
      required:
      - email
      - id
    BillingSubscription:
      example:
        id: id
        current_period_end: 2000-01-23T04:56:07.000+00:00
        plan_id: plan_id
        status: active
      properties:
        id:
          type: string
        status:
          enum:
          - active
          - canceled
          - past_due
          - incomplete
          type: string
        plan_id:
          type: string
        current_period_end:
          format: date-time
          type: string
      required:
      - id
      - plan_id
      - status
    AutomationFlow:
      example:
        zone_id: zone_id
        nodes:
        - data: "{}"
          id: id
          position: "{}"
          type: type
        - data: "{}"
          id: id
          position: "{}"
          type: type
        updated_at: 2000-01-23T04:56:07.000+00:00
        org_id: org_id
        name: name
        edges:
        - source_handle: source_handle
          id: id
          source: source
          target: target
        - source_handle: source_handle
          id: id
          source: source
          target: target
        description: description
        created_at: 2000-01-23T04:56:07.000+00:00
        id: id
        trigger:
          event_type: event_type
          type: type
          config: "{}"
        version: 0
        enabled: true
      properties:
        id:
          type: string
        org_id:
          type: string
        zone_id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
        trigger:
          $ref: "#/components/schemas/AutomationFlowTrigger"
        nodes:
          items:
            $ref: "#/components/schemas/AutomationFlowNode"
          type: array
        edges:
          items:
            $ref: "#/components/schemas/AutomationFlowEdge"
          type: array
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - id
      - name
      - zone_id
    AutomationFlowTrigger:
      example:
        event_type: event_type
        type: type
        config: "{}"
      properties:
        type:
          type: string
        event_type:
          type: string
        config:
          type: object
      required:
      - type
    AutomationFlowNode:
      example:
        data: "{}"
        id: id
        position: "{}"
        type: type
      properties:
        id:
          type: string
        type:
          type: string
        position:
          type: object
        data:
          type: object
      required:
      - id
      - type
    AutomationFlowEdge:
      example:
        source_handle: source_handle
        id: id
        source: source
        target: target
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        source_handle:
          type: string
      required:
      - id
      - source
      - target
    AutomationFlowExecution:
      example:
        output: "{}"
        input: "{}"
        flow_id: flow_id
        trigger_id: trigger_id
        flow_version: 0
        started_at: 2000-01-23T04:56:07.000+00:00
        id: id
        current_node_id: current_node_id
        steps:
        - output: "{}"
          input: "{}"
          error: error
          node_id: node_id
          status: status
        - output: "{}"
          input: "{}"
          error: error
          node_id: node_id
          status: status
        ended_at: 2000-01-23T04:56:07.000+00:00
        status: pending
      properties:
        id:
          type: string
        flow_id:
          type: string
        flow_version:
          type: integer
        trigger_id:
          type: string
        status:
          enum:
          - pending
          - running
          - paused
          - completed
          - failed
          type: string
        current_node_id:
          type: string
        input:
          type: object
        output:
          type: object
        steps:
          items:
            $ref: "#/components/schemas/AutomationFlowExecutionStep"
          type: array
        started_at:
          format: date-time
          type: string
        ended_at:
          format: date-time
          type: string
      required:
      - flow_id
      - id
      - status
    AutomationFlowExecutionStep:
      example:
        output: "{}"
        input: "{}"
        error: error
        node_id: node_id
        status: status
      properties:
        node_id:
          type: string
        status:
          type: string
        input:
          type: object
        output:
          type: object
        error:
          type: string
      required:
      - node_id
      - status
    registerUser_request:
